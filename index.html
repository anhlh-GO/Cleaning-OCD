<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7cc3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cleaning ASMR</title>
<style>
  @font-face { font-family: Duddy; src: url(assets/Duddy-Black.otf); }
  :root { --ink: #1e3a5f; --accent: #ffb52e; --accent2: #ff7a2e; --good: #35c46a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #10202f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: Duddy, 'Arial Rounded MT Bold', system-ui, sans-serif; }
  #stage { position: relative; overflow: hidden; background: #cfe6f5; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 12px 0; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .btn { pointer-events: auto; width: 44px; height: 44px; border-radius: 14px; border: 0; background: #fff; box-shadow: 0 4px 0 #b9cfe0, 0 6px 12px rgba(0,0,0,.15); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9cfe0; }
  .btn svg { width: 24px; height: 24px; }
  .btn.off .on-i { display: none; } .btn:not(.off) .off-i { display: none; }
  .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #lvl { color: #fff; font-size: 22px; letter-spacing: .5px; text-shadow: 0 2px 0 var(--ink), 0 0 2px var(--ink), 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
  .pb { width: 78%; max-width: 230px; height: 14px; border-radius: 10px; background: rgba(255,255,255,.7); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); overflow: hidden; }
  #pbar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 8px; transition: width .15s; }
  #dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; }
  #dots.many i { width: 6px; height: 6px; border-width: 1px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.6); border: 1.5px solid rgba(30,58,95,.35); }
  #dots i.on { background: var(--accent); transform: scale(1.25); }
  #dots i.done { background: var(--good); }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 5; }
  .overlay.show { display: flex; }
  #loading { background: linear-gradient(#8fd0f5, #cfe9f9); color: var(--ink); gap: 14px; }
  #loading h1 { margin: 0; font-size: 34px; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 3px var(--ink); }
  .lb { width: 60%; height: 14px; border-radius: 10px; background: #fff; overflow: hidden; }
  #loadbar { height: 100%; width: 0; background: var(--accent); }
  #win { background: rgba(10,30,50,.55); animation: fadein .3s; }
  .card { background: #fff; border-radius: 26px; padding: 26px 26px 22px; width: min(82%, 320px); text-align: center; box-shadow: 0 10px 0 #b9cfe0, 0 20px 40px rgba(0,0,0,.3); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .card h2 { margin: 0 0 4px; font-size: 32px; color: var(--accent2); text-shadow: 0 2px 0 #ffe1b0; }
  .card p { margin: 0 0 16px; color: var(--ink); opacity: .75; font-size: 16px; }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 6px 0 14px; color: var(--accent); filter: drop-shadow(0 3px 0 #e09a10); }
  .big { pointer-events: auto; display: block; width: 100%; border: 0; border-radius: 18px; padding: 14px; font: inherit; font-size: 22px; color: #fff; background: var(--good); box-shadow: 0 5px 0 #1f9a4c; cursor: pointer; }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #1f9a4c; }
  .big.alt { margin-top: 10px; background: #8fb4d1; box-shadow: 0 5px 0 #6a8fae; font-size: 18px; padding: 10px; }
  #levels { background: linear-gradient(#8fd0f5, #e3f3fc); justify-content: flex-start; padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  #levels .hd { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #levels h3 { margin: 0; color: #fff; font-size: 28px; text-shadow: 0 3px 0 var(--ink), 0 0 3px var(--ink); }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; overflow-y: auto; padding-bottom: 20px; }
  .lv { aspect-ratio: 1; border: 0; border-radius: 16px; background: #fff; color: var(--ink); font: inherit; font-size: 22px; box-shadow: 0 4px 0 #b9cfe0; cursor: pointer; position: relative; }
  .lv.done { background: #d8f5e2; box-shadow: 0 4px 0 #8fd6a8; }
  .lv.done::after { content: '✓'; position: absolute; right: 5px; top: 2px; font-size: 13px; color: var(--good); }
  .lv.cur { outline: 3px solid var(--accent); }
  #tapstart { background: transparent; z-index: 4; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fadein { from { opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="top">
    <button class="btn" id="btnHome" aria-label="Chọn level"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>
    <div class="mid"><div id="lvl">Level 1</div><div class="pb"><div id="pbar"></div></div><div id="dots"></div></div>
    <button class="btn" id="btnSound" aria-label="Âm thanh"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on-i" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="off-i" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="btn" id="btnRestart" aria-label="Chơi lại"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8 8.5 8.5 0 00-6 2.6L4 8.5"/><path d="M4 3.5v5h5"/></svg></button>
  </div>
  <div class="overlay show" id="loading"><h1>Cleaning</h1><div class="lb"><div id="loadbar"></div></div></div>
  <div class="overlay" id="win"><div class="card"><h2>Sạch bong!</h2><p id="winlvl">Level 1</p><div class="stars">★★★</div><button class="big" id="btnNext">Tiếp tục</button><button class="big alt" id="btnReplay">Chơi lại</button></div></div>
  <div class="overlay" id="levels"><div class="hd"><h3>Chọn Level</h3><button class="btn" id="btnClose" aria-label="Đóng"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="grid"></div></div>
  <div class="overlay" id="tapstart"></div>
</div>
<script src="vendor/spine-canvas.js"></script>
<script src="js/core.js"></script>
<script src="js/scene.js"></script>
<script src="js/fx.js"></script>
<script src="js/steps.js"></script>
<script src="js/game.js"></script>
</body>
</html>
